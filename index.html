<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>한별 그림책 도서관</title><style>
:root{--cream:#f7f0e4;--ink:#493d32;--green:#687c62}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif}header{text-align:center;padding:40px 15px 26px;background:#e5e9d9;border-bottom:5px solid #d3b795}header h1{font-family:serif;font-size:clamp(30px,6vw,48px);margin:8px}header p{margin:5px;color:#68745f}.wrap{max-width:1100px;margin:auto;padding:28px 18px}.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:27px 22px}.book{cursor:pointer;border:0;background:transparent;color:inherit;text-align:center;font:inherit}.book img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;box-shadow:5px 7px 0 #ad8764,7px 11px 14px #0003;border-radius:3px;transition:transform .2s}.book:hover img{transform:translateY(-7px)}.book strong{display:block;margin:16px 0 5px;line-height:1.45}.book small{color:#776b60}.viewer{display:none;position:fixed;inset:0;background:#e9e1d4;z-index:5;flex-direction:column}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;background:#f9f5eb;box-shadow:0 2px 7px #0002}.toolbar h2{font-size:15px;margin:0;text-align:center;flex:1}.toolbar button,.actions button{border:0;background:#647960;color:white;border-radius:9px;padding:11px 14px;cursor:pointer}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;perspective:1400px}.spread{height:100%;max-width:100%;display:flex;align-items:center;justify-content:center;gap:2px}.spread img{display:block;max-height:100%;max-width:100%;width:auto;object-fit:contain;box-shadow:0 5px 20px #0002;background:white}.spread.double img{max-width:49.5%}.turn{animation:flip .36s ease}@keyframes flip{from{opacity:.65;transform:rotateY(-14deg) scale(.97)}to{opacity:1;transform:none}}.actions{display:flex;justify-content:center;align-items:center;gap:12px;padding:12px}.actions span{min-width:65px;text-align:center}.actions button:disabled{opacity:.35}.note{text-align:center;font-size:13px;color:#766b5f;margin:25px auto}footer{text-align:center;padding:25px;font-size:12px;color:#776b60}@media(max-width:700px){.spread.double img{max-width:100%}.shelf{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar button{padding:10px}}
</style></head><body><header><div>🌿 📖 🌿</div><h1>한별 그림책 도서관</h1><p>상상이 책이 되는 곳 · 우리들의 이야기</p></header><main class="wrap"><div id="shelf" class="shelf"></div><p class="note">표지를 누르면 책이 열려요. 휴대전화에서는 한 장씩, 넓은 화면에서는 두 장씩 읽을 수 있어요.</p></main><footer>인천한별초등학교 · 학생 창작 그림책 · 작품의 무단 복제 및 재배포를 삼가 주세요.</footer><section class="viewer" id="viewer" role="dialog" aria-label="그림책 읽기"><div class="toolbar"><button onclick="closeBook()">← 도서관</button><h2 id="bookTitle"></h2><button onclick="shareBook()">🔗 링크 복사</button></div><div class="stage" id="stage"><div id="spread" class="spread"></div></div><div class="actions"><button id="prev" onclick="step(-1)">◀ 이전</button><span id="counter"></span><button id="next" onclick="step(1)">다음 ▶</button></div></section><script>
let books=[],current=null,page=0;const $=x=>document.getElementById(x);fetch('books.json').then(r=>r.json()).then(data=>{books=data;books.forEach(b=>{const button=document.createElement('button');button.className='book';button.innerHTML=`<img loading="lazy" src="${b.pages[0]}" alt=""><strong></strong><small></small>`;button.querySelector('strong').textContent=b.title;button.querySelector('small').textContent=b.author?b.author+' · '+b.count+'쪽':b.count+'쪽';button.onclick=()=>openBook(b.id);$('shelf').appendChild(button)});let id=new URLSearchParams(location.search).get('book');if(id&&books.some(b=>b.id===id))openBook(id)});
function openBook(id){current=books.find(b=>b.id===id);if(!current)return;page=0;$('viewer').style.display='flex';document.body.style.overflow='hidden';$('bookTitle').textContent=current.title;history.replaceState(null,'','?book='+id);render()}function closeBook(){current=null;$('viewer').style.display='none';document.body.style.overflow='';history.replaceState(null,'',location.pathname)}function double(){return innerWidth>700}function render(){if(!current)return;let count=double()&&page>0?Math.min(2,current.pages.length-page):1;let images=current.pages.slice(page,page+count);$('spread').className='spread turn'+(count===2?' double':'');$('spread').innerHTML='';images.forEach(src=>{let im=document.createElement('img');im.src=src;im.alt=`${current.title} ${page+1}쪽`;im.draggable=false;$('spread').appendChild(im)});$('counter').textContent=`${page+1}${count===2?'–'+(page+2):''} / ${current.count}`;$('prev').disabled=page===0;$('next').disabled=page+count>=current.count}function step(dir){if(!current)return;if(dir<0)page=Math.max(0,page-(double()&&page>1?2:1));else page=Math.min(current.count-1,page+(double()&&page>0?2:1));render()}function shareBook(){let u=location.href;navigator.clipboard?.writeText(u).then(()=>alert('책 링크를 복사했어요!')).catch(()=>prompt('책 링크를 복사하세요',u))||prompt('책 링크',u)}addEventListener('resize',()=>{if(current)render()});addEventListener('keydown',e=>{if(!current)return;if(e.key==='Escape')closeBook();if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});let touchX=null;$('stage').addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{if(touchX===null)return;let dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>55)step(dx<0?1:-1);touchX=null},{passive:true});
</script></body></html>
